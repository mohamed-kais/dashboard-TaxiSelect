[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "dist/sms-taxi-admin"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to = "http://41.225.11.231:8444/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
